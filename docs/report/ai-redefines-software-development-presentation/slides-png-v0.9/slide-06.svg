    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">06 / 12</text>



    <text x="96" y="146" class="h15" style="font-size:64px">BitFun：把 AI 执行放进工程控制面</text>
    <text x="100" y="244" class="sub5">规则上下文、工具准入、权限隔离和验证矩阵，共同保护 AI 交付能力。</text>
    <path d="M96 318 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="318" r="5.5" fill="#FF5A1F"/>

    <text x="142" y="366" class="small5" style="font-size:24px;fill:#5F6670;font-weight:820">模型生成的是可能性；BitFun 的控制面负责把可能性放进可读取、可拦截、可复核的工程轨道。</text>
    <rect x="120" y="424" width="1680" height="360" rx="20" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <path d="M540 462 V750 M960 462 V750 M1380 462 V750" stroke="#C4C6C1" stroke-width="2"/>

    <g>
      <circle cx="198" cy="518" r="38" fill="#106BEF" opacity="0.11"/>
      <g transform="translate(174 494) scale(0.75)"><path d="M18 8 h22 l10 10 v38 H18 Z M40 8 v12 h12 M26 32 h20 M26 42 h18" stroke="#106BEF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
      <text x="254" y="484" class="num5" style="font-size:34px;fill:#106BEF">01</text>
      <text x="254" y="530" class="label5" style="font-size:30px">规则上下文</text>
      <text x="160" y="600" class="small5" style="font-size:22px;fill:#106BEF;font-weight:900">先明确边界</text>
      <path d="M160 634 H490" stroke="#106BEF" stroke-width="3.2" stroke-linecap="round" opacity="0.65"/>

      <circle cx="178" cy="668" r="5.5" fill="#106BEF" opacity="0.80"/>
      <text x="198" y="656" class="small5" style="font-size:22px;fill:#050608;font-weight:800">仓库 / 模块规则文件</text>

      <circle cx="178" cy="714" r="5.5" fill="#106BEF" opacity="0.80"/>
      <text x="198" y="702" class="small5" style="font-size:22px;fill:#050608;font-weight:800">架构、日志、远程规则</text>

      <circle cx="178" cy="760" r="5.5" fill="#106BEF" opacity="0.80"/>
      <text x="198" y="748" class="small5" style="font-size:22px;fill:#050608;font-weight:800">先有事实，再有生成</text>

    </g>


    <g>
      <circle cx="618" cy="518" r="38" fill="#FF5A1F" opacity="0.11"/>
      <g transform="translate(594 494) scale(0.75)"><rect x="10" y="10" width="18" height="18" stroke="#FF5A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="36" y="10" width="18" height="18" stroke="#FF5A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="10" y="36" width="18" height="18" stroke="#FF5A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M41 36 l14 9 l-14 9 l-14 -9 Z" stroke="#FF5A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
      <text x="674" y="484" class="num5" style="font-size:34px;fill:#FF5A1F">02</text>
      <text x="674" y="530" class="label5" style="font-size:30px">工具准入</text>
      <text x="580" y="600" class="small5" style="font-size:22px;fill:#FF5A1F;font-weight:900">工具不是无限开放</text>
      <path d="M580 634 H910" stroke="#FF5A1F" stroke-width="3.2" stroke-linecap="round" opacity="0.65"/>

