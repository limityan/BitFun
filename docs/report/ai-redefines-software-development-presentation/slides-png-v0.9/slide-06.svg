      <text x="1094" y="530" class="label5" style="font-size:30px">权限隔离</text>
      <text x="1000" y="600" class="small5" style="font-size:22px;fill:#106BEF;font-weight:900">影响面必须可控</text>
      <path d="M1000 634 H1330" stroke="#106BEF" stroke-width="3.2" stroke-linecap="round" opacity="0.65"/>

      <circle cx="1018" cy="668" r="5.5" fill="#106BEF" opacity="0.80"/>
      <text x="1038" y="656" class="small5" style="font-size:22px;fill:#050608;font-weight:800">产物不越过根目录</text>

      <circle cx="1018" cy="714" r="5.5" fill="#106BEF" opacity="0.80"/>
      <text x="1038" y="702" class="small5" style="font-size:22px;fill:#050608;font-weight:800">文件 / 命令 / 网络白名单</text>

      <circle cx="1018" cy="760" r="5.5" fill="#106BEF" opacity="0.80"/>
      <text x="1038" y="748" class="small5" style="font-size:22px;fill:#050608;font-weight:800">高风险权限差异</text>

    </g>


    <g>
      <circle cx="1458" cy="518" r="38" fill="#FF5A1F" opacity="0.11"/>
      <g transform="translate(1434 494) scale(0.75)"><rect x="12" y="10" width="40" height="44" rx="4" stroke="#FF5A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M22 32 l8 8 l14 -18" stroke="#FF5A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
      <text x="1514" y="484" class="num5" style="font-size:34px;fill:#FF5A1F">04</text>
      <text x="1514" y="530" class="label5" style="font-size:30px">验证矩阵</text>
      <text x="1420" y="600" class="small5" style="font-size:22px;fill:#FF5A1F;font-weight:900">按风险选择验证</text>
      <path d="M1420 634 H1750" stroke="#FF5A1F" stroke-width="3.2" stroke-linecap="round" opacity="0.65"/>

      <circle cx="1438" cy="668" r="5.5" fill="#FF5A1F" opacity="0.80"/>
      <text x="1458" y="656" class="small5" style="font-size:22px;fill:#050608;font-weight:800">前端检查 / 类型 / 测试</text>

      <circle cx="1438" cy="714" r="5.5" fill="#FF5A1F" opacity="0.80"/>
      <text x="1458" y="702" class="small5" style="font-size:22px;fill:#050608;font-weight:800">深度评审专项测试</text>

      <circle cx="1438" cy="760" r="5.5" fill="#FF5A1F" opacity="0.80"/>
      <text x="1458" y="748" class="small5" style="font-size:22px;fill:#050608;font-weight:800">后端 / 桌面分层检查</text>

    </g>


    <rect x="170" y="954" width="1580" height="64" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M240 971 v30" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="986" y="984" class="body5" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" style="font-size:27px">关键不是让 AI 能做更多，而是让每次执行都有边界、审计和验证入口。</text>


