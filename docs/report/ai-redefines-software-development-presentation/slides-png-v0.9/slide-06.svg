      <text x="618" y="656" class="small5" style="font-size:22px;fill:#050608;font-weight:800">可用工具白名单</text>

      <circle cx="598" cy="714" r="5.5" fill="#FF5A1F" opacity="0.80"/>
      <text x="618" y="702" class="small5" style="font-size:22px;fill:#050608;font-weight:800">运行时限制</text>

      <circle cx="598" cy="760" r="5.5" fill="#FF5A1F" opacity="0.80"/>
      <text x="618" y="748" class="small5" style="font-size:22px;fill:#050608;font-weight:800">先读工具规格</text>

    </g>


    <g>
      <circle cx="1038" cy="518" r="38" fill="#106BEF" opacity="0.11"/>
