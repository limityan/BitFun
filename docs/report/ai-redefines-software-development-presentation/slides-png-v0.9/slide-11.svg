    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", "Segoe UI", Arial, sans-serif; dominant-baseline: hanging; }
      .brand5 { font-size: 42px; font-weight: 900; fill: #050608; }
      .num5 { font-family: "Arial", "Microsoft YaHei", sans-serif; font-weight: 900; fill: #050608; }
      .h15 { font-size: 68px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .h25 { font-size: 58px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .sub5 { font-size: 31px; font-weight: 560; fill: #5F6670; }
      .body5 { font-size: 30px; font-weight: 700; fill: #050608; }
      .muted5 { font-size: 24px; font-weight: 560; fill: #5F6670; }
      .label5 { font-size: 29px; font-weight: 900; fill: #050608; }
      .small5 { font-size: 23px; font-weight: 760; fill: #5F6670; }
      .micro5 { font-size: 19px; font-weight: 760; fill: #5F6670; }
    </style>
    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">11 / 12</text>



    <text x="96" y="146" class="h15" style="font-size:58px">职责变化：团队建系统，个人守判断</text>
    <text x="100" y="244" class="sub5">团队把上下文、证据、指标和门禁做实；个人在目标、边界、风险和责任上站稳。</text>
    <path d="M96 318 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="318" r="5.5" fill="#FF5A1F"/>

    <rect x="110" y="376" width="800" height="444" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <rect x="1010" y="376" width="800" height="444" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="166" y="430" class="small5" style="font-size:24px;fill:#106BEF;font-weight:900">团队职责</text>
    <text x="166" y="484" class="num5" style="font-size:42px;fill:#050608">团队：把流程做实</text>

    <text x="168" y="568" class="micro5" style="font-size:20px;fill:#106BEF;font-weight:900">01</text>
    <text x="216" y="566" class="small5" style="font-size:25px;fill:#050608;font-weight:900">组织上下文</text>
    <text x="372" y="568" class="small5" style="font-size:21px;fill:#5F6670;font-weight:760">需求、架构、日志、测试、历史决策进入 Agent 视野</text>


    <text x="168" y="636" class="micro5" style="font-size:20px;fill:#106BEF;font-weight:900">02</text>
    <text x="216" y="634" class="small5" style="font-size:25px;fill:#050608;font-weight:900">证据交付</text>
    <text x="372" y="636" class="small5" style="font-size:21px;fill:#5F6670;font-weight:760">把测试、构建、轨迹、评审变成交付的一部分</text>


    <text x="168" y="704" class="micro5" style="font-size:20px;fill:#FF5A1F;font-weight:900">03</text>
    <text x="216" y="702" class="small5" style="font-size:25px;fill:#050608;font-weight:900">净收益指标</text>
    <text x="372" y="704" class="small5" style="font-size:21px;fill:#5F6670;font-weight:760">看净时间、返工率、评审压力和线上风险</text>


    <text x="168" y="772" class="micro5" style="font-size:20px;fill:#FF5A1F;font-weight:900">04</text>
    <text x="216" y="770" class="small5" style="font-size:25px;fill:#050608;font-weight:900">阶段门禁</text>
    <text x="372" y="772" class="small5" style="font-size:21px;fill:#5F6670;font-weight:760">用权限、隔离、独立评审承接自动化责任</text>

    <text x="1066" y="430" class="small5" style="font-size:24px;fill:#FF5A1F;font-weight:900">个人职责</text>
    <text x="1066" y="484" class="num5" style="font-size:42px;fill:#050608">个人：把判断站稳</text>

    <text x="1068" y="568" class="micro5" style="font-size:20px;fill:#106BEF;font-weight:900">01</text>
    <text x="1116" y="566" class="small5" style="font-size:25px;fill:#050608;font-weight:900">定义问题</text>
    <text x="1272" y="568" class="small5" style="font-size:21px;fill:#5F6670;font-weight:760">说明目标、非目标、验收标准和风险边界</text>


    <text x="1068" y="636" class="micro5" style="font-size:20px;fill:#106BEF;font-weight:900">02</text>
    <text x="1116" y="634" class="small5" style="font-size:25px;fill:#050608;font-weight:900">核验事实</text>
    <text x="1272" y="636" class="small5" style="font-size:21px;fill:#5F6670;font-weight:760">选择可信上下文，理解代码、架构和运行约束</text>


    <text x="1068" y="704" class="micro5" style="font-size:20px;fill:#FF5A1F;font-weight:900">03</text>
    <text x="1116" y="702" class="small5" style="font-size:25px;fill:#050608;font-weight:900">解释风险</text>
    <text x="1272" y="704" class="small5" style="font-size:21px;fill:#5F6670;font-weight:760">判断能不能合、哪里要慢、谁需要参与</text>


    <text x="1068" y="772" class="micro5" style="font-size:20px;fill:#FF5A1F;font-weight:900">04</text>
    <text x="1116" y="770" class="small5" style="font-size:25px;fill:#050608;font-weight:900">承接责任</text>
    <text x="1272" y="772" class="small5" style="font-size:21px;fill:#5F6670;font-weight:760">出了问题能解释、回滚、复盘和沉淀</text>

