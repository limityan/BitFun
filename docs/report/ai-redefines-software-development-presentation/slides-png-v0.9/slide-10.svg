    <text x="960" y="841" class="body5" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" style="font-size:26px"><tspan style="fill:#106BEF;font-weight:900">迁移判断：</tspan><tspan>能力没丢、边界没破、行为没变，再让 AI 扩大改造范围。</tspan></text>

    <rect x="170" y="954" width="1580" height="64" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M240 971 v30" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="986" y="974" class="body5" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" style="font-size:27px">能力保护式演进：让 AI 提速发生在可证明的迁移协议里，而不是靠重构后的自信。</text>


