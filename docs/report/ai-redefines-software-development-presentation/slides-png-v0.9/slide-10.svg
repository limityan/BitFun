      <text x="618" y="682" class="small5" style="font-size:24px;fill:#050608;font-weight:900">端口与适配器</text>
      <text x="618" y="726" class="small5" style="font-size:21px;fill:#5F6670;font-weight:820">把所有权迁移边界讲清</text>
    </g>


    <g>
      <circle cx="1094" cy="564" r="48" fill="#106BEF" opacity="0.10"/>
      <g transform="translate(1064 534) scale(0.9375)"><path d="M32 6 L52 14 V30 q0 18 -20 28 Q12 48 12 30 V14 Z M22 32 l7 7 l15 -18" stroke="#106BEF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
