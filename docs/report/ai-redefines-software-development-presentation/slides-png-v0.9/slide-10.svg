    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">10 / 12</text>



    <text x="96" y="146" class="h15" style="font-size:60px">能力演进</text>
    <text x="100" y="244" class="sub5">AI 可以加速拆解和迁移，但产品能力、平台边界和行为等价要先被证明。</text>
