    <g transform="translate(718 468) scale(1.09375)"><path d="M18 8 h22 l10 10 v38 H18 Z M40 8 v12 h12 M26 32 h20 M26 42 h18" stroke="#106BEF" stroke-width="2.742857142857143" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="758" y="560" class="label5" text-anchor="middle" style="font-size:32px">设计沉淀</text>
    <text x="758" y="616" class="small5" text-anchor="middle" style="font-size:23px;fill:#5F6670;font-weight:650">变更理由要留下</text><text x="758" y="648" class="small5" text-anchor="middle" style="font-size:23px;fill:#5F6670;font-weight:650">否则后续协作断层</text>
