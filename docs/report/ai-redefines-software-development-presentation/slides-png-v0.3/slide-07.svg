    <text x="1564" y="560" class="label5" text-anchor="middle" style="font-size:32px">修复证据</text>
    <text x="1564" y="616" class="small5" text-anchor="middle" style="font-size:23px;fill:#5F6670;font-weight:650">不能只凭自信 patch</text><text x="1564" y="648" class="small5" text-anchor="middle" style="font-size:23px;fill:#5F6670;font-weight:650">要复现、验证、回归</text>
