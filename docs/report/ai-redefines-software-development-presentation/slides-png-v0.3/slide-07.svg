    <text x="1161" y="560" class="label5" text-anchor="middle" style="font-size:32px">团队共识</text>
    <text x="1161" y="616" class="small5" text-anchor="middle" style="font-size:23px;fill:#5F6670;font-weight:650">个人 + Agent 很快</text><text x="1161" y="648" class="small5" text-anchor="middle" style="font-size:23px;fill:#5F6670;font-weight:650">团队理解未必同步</text>
