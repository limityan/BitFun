    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">07 / 13</text>



    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">02 / 质量责任</text>
    <text x="96" y="188" class="h15" style="font-size:64px">速度放大之后，质量责任被重新定义</text>
    <text x="100" y="282" class="sub5">代码很多，但评审、测试、追溯和长期维护不一定同步跟上。</text>
