    <text x="204" y="448" class="label5" style="font-size:30px">DORA：AI 是放大器</text>
    <text x="204" y="496" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">80%+ 受访者感到生产力提升；</text><text x="204" y="528" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">组织文化、流程和系统决定能否放大收益；</text><text x="204" y="560" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">碎片化组织也会被 AI 放大弱点。</text>


    <rect x="680" y="390" width="560" height="260" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="714" y="414" class="micro5" style="fill:#FF5A1F;font-size:19px;font-weight:900">任务层</text>
    <g transform="translate(714 440) scale(0.90625)"><path d="M48 18 A22 22 0 0 0 14 24 M14 24 h12 M14 24 v-12 M16 46 A22 22 0 0 0 50 40 M50 40 H38 M50 40 v12" stroke="#FF5A1F" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M24 34 l7 7 l13 -17" stroke="#FF5A1F" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="792" y="448" class="label5" style="font-size:30px">METR：熟悉代码库未必更快</text>
    <text x="792" y="496" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">2025 RCT：熟悉项目中使用早期 AI</text><text x="792" y="528" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">工具反而慢 19%；</text><text x="792" y="560" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">多 Agent 时代让测量更难。</text>


    <rect x="1268" y="390" width="560" height="260" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
