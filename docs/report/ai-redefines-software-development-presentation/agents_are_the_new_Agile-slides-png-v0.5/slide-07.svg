    <text x="1380" y="448" class="label5" style="font-size:30px">Harness：隐形工作增加</text>
    <text x="1380" y="496" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">81% 认为 review 时间增加；</text><text x="1380" y="528" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">约 31% 时间进入 review、修 bug、工具切换；</text><text x="1380" y="560" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">传统指标难以捕获这些工作。</text>

