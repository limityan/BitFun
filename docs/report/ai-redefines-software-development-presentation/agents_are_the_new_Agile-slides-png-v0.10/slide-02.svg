    </g>




    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", "Segoe UI", Arial, sans-serif; dominant-baseline: hanging; }
      .brand5 { font-size: 42px; font-weight: 900; fill: #050608; }
      .num5 { font-family: "Arial", "Microsoft YaHei", sans-serif; font-weight: 900; fill: #050608; }
      .h15 { font-size: 68px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .h25 { font-size: 58px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .sub5 { font-size: 31px; font-weight: 560; fill: #5F6670; }
      .body5 { font-size: 30px; font-weight: 700; fill: #050608; }
      .muted5 { font-size: 24px; font-weight: 560; fill: #5F6670; }
      .label5 { font-size: 29px; font-weight: 900; fill: #050608; }
      .small5 { font-size: 23px; font-weight: 760; fill: #5F6670; }
      .micro5 { font-size: 19px; font-weight: 760; fill: #5F6670; }
    </style>
    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">02 / 12</text>


    <text x="96" y="146" class="h15" style="font-size:60px">目录</text>
    <path d="M96 220 h126" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="246" cy="220" r="6" fill="#FF5A1F"/>
    <path d="M178 340 V808" stroke="#C4C6C1" stroke-width="3" stroke-dasharray="8 12"/>

    <rect x="210" y="292" width="900" height="110" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="246" y="316" class="num5" style="font-size:40px;fill:#106BEF">01</text>
    <text x="326" y="314" class="label5" style="font-size:30px">软件工程变革</text>
    <text x="326" y="356" class="small5" style="font-size:21px;fill:#5F6670;font-weight:820">从 BitFun 高吞吐经验看生命周期交付件变化。</text>
    <text x="1060" y="328" class="small5" text-anchor="end" style="fill:#106BEF;font-size:21px;font-weight:900">03</text>


    <rect x="318" y="424" width="900" height="110" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="354" y="448" class="num5" style="font-size:40px;fill:#106BEF">02</text>
    <text x="434" y="446" class="label5" style="font-size:30px">速度的背后</text>
    <text x="434" y="488" class="small5" style="font-size:21px;fill:#5F6670;font-weight:820">研究和工具都指向系统化承接，而不是单点提速。</text>
    <text x="1168" y="460" class="small5" text-anchor="end" style="fill:#106BEF;font-size:21px;font-weight:900">04-05</text>


    <rect x="210" y="556" width="900" height="110" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="246" y="580" class="num5" style="font-size:40px;fill:#106BEF">03</text>
    <text x="326" y="578" class="label5" style="font-size:30px">工程质量与治理</text>
    <text x="326" y="620" class="small5" style="font-size:21px;fill:#5F6670;font-weight:820">五层模型把概率执行收敛为可判断交付。</text>
    <text x="1060" y="592" class="small5" text-anchor="end" style="fill:#106BEF;font-size:21px;font-weight:900">06-09</text>


    <rect x="318" y="688" width="900" height="110" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="354" y="712" class="num5" style="font-size:40px;fill:#106BEF">04</text>
    <text x="434" y="710" class="label5" style="font-size:30px">开发者角色</text>
    <text x="434" y="752" class="small5" style="font-size:21px;fill:#5F6670;font-weight:820">团队建设系统，个人承担关键判断和责任。</text>
    <text x="1168" y="724" class="small5" text-anchor="end" style="fill:#106BEF;font-size:21px;font-weight:900">10-12</text>


</svg>