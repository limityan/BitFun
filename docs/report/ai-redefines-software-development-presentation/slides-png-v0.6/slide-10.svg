    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">10 / 13</text>



    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">05 / 工程质量</text>
    <text x="96" y="188" class="h15" style="font-size:64px">工程质量：责任链、证据链、Artifact 链</text>
    <text x="100" y="282" class="sub5">质量要求不能停留在口头承诺里，必须变成可复核工件。</text>
    <path d="M96 356 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="356" r="5.5" fill="#FF5A1F"/>

    <rect x="110" y="410" width="520" height="300" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="164" y="462" class="small5" style="fill:#106BEF;font-weight:900">开源高质量要求</text>
    <text x="164" y="522" class="num5" style="font-size:38px">提升对提交质量的信任</text>
    <text x="164" y="590" class="small5" style="font-size:23px;fill:#5F6670;font-weight:650">贡献者对代码负责</text><text x="164" y="624" class="small5" style="font-size:23px;fill:#5F6670;font-weight:650">维护者看方向、可读性、测试</text><text x="164" y="658" class="small5" style="font-size:23px;fill:#5F6670;font-weight:650">小批量变更 + 可复核证据</text>
    <rect x="1290" y="410" width="520" height="300" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="1344" y="462" class="small5" style="fill:#FF5A1F;font-weight:900">大厂复杂交付</text>
    <text x="1344" y="522" class="num5" style="font-size:38px">稳定工件贯穿系统</text>
    <text x="1344" y="590" class="small5" style="font-size:23px;fill:#5F6670;font-weight:650">需求 / 设计 / API / SLO</text><text x="1344" y="624" class="small5" style="font-size:23px;fill:#5F6670;font-weight:650">证据贯穿计划、发布与复盘</text><text x="1344" y="658" class="small5" style="font-size:23px;fill:#5F6670;font-weight:650">owner、回滚、合规可追踪</text>
    <circle cx="960" cy="560" r="170" fill="#FBFAF7" stroke="#C4C6C1" stroke-width="3"/>
    <text x="960" y="424" class="small5" text-anchor="middle" style="font-size:22px;fill:#5F6670;font-weight:900">共同检查面</text>
    <text x="960" y="478" class="num5" text-anchor="middle" style="font-size:36px;fill:#106BEF">责任链</text>
    <text x="960" y="548" class="num5" text-anchor="middle" style="font-size:36px;fill:#050608">证据链</text>
    <text x="960" y="618" class="num5" text-anchor="middle" style="font-size:36px;fill:#FF5A1F">Artifact 链</text>

    <rect x="220" y="954" width="1480" height="64" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M290 971 v30" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="986" y="986" class="body5" text-anchor="middle" dominant-baseline="central" alignment-baseline="middle" style="font-size:27px">质量治理不是多一道审批，而是把责任、证据和工程约束变成可复核工件。</text>


