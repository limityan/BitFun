    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">08 / 13</text>



    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">04 / 证据对象</text>
    <text x="96" y="188" class="h15" style="font-size:64px">证据包：让团队审查对象变小</text>
    <text x="100" y="282" class="sub5">人不需要重放每一步，但必须能审查差异、测试、风险和责任。</text>
    <path d="M96 356 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="356" r="5.5" fill="#FF5A1F"/>

    <text x="132" y="396" class="small5" style="font-size:23px;fill:#106BEF;font-weight:900">代码生产放大以后，团队要审查的是可压缩、可复核的证据对象</text>

    <rect x="116" y="436" width="704" height="104" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <g transform="translate(150 459) scale(0.84375)"><path d="M18 18 L34 32 L18 46" stroke="#106BEF" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M38 48 h16" stroke="#106BEF" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="216" y="458" class="num5" style="font-size:30px;fill:#106BEF">01</text>
    <text x="272" y="458" class="label5" style="font-size:28px">任务规格</text>
    <text x="272" y="508" class="small5" style="font-size:19px;fill:#5F6670;font-weight:720">目标、非目标、影响范围和验收标准必须先写清楚。</text>


    <rect x="116" y="566" width="704" height="104" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <g transform="translate(150 589) scale(0.84375)"><circle cx="32" cy="22" r="8" stroke="#FF5A1F" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="18" cy="30" r="6" stroke="#FF5A1F" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="46" cy="30" r="6" stroke="#FF5A1F" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M14 50 q18 -16 36 0 M4 54 q14 -12 28 -5 M32 49 q14 -7 28 5" stroke="#FF5A1F" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="216" y="588" class="num5" style="font-size:30px;fill:#FF5A1F">02</text>
    <text x="272" y="588" class="label5" style="font-size:28px">执行轨迹</text>
    <text x="272" y="638" class="small5" style="font-size:19px;fill:#5F6670;font-weight:720">记录关键工具调用、失败尝试、上下文差异和权限边界。</text>


    <rect x="116" y="696" width="704" height="104" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <g transform="translate(150 719) scale(0.84375)"><rect x="12" y="10" width="40" height="44" rx="4" stroke="#106BEF" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M22 32 l8 8 l14 -18" stroke="#106BEF" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="216" y="718" class="num5" style="font-size:30px;fill:#106BEF">03</text>
    <text x="272" y="718" class="label5" style="font-size:28px">放行证据</text>
    <text x="272" y="768" class="small5" style="font-size:19px;fill:#5F6670;font-weight:720">人不重放每步操作，而是审 diff、测试、风险、owner。</text>

