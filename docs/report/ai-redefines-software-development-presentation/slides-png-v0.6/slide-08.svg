    <text x="1040" y="706" class="micro5" style="font-size:16px;fill:#BBF7D0;font-weight:900">证据不是口头说明，而是可复核产物</text>


    <rect x="250" y="954" width="1420" height="64" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
