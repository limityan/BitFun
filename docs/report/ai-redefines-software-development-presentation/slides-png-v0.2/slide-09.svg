    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", "Segoe UI", Arial, sans-serif; dominant-baseline: hanging; }
      .brand5 { font-size: 42px; font-weight: 900; fill: #050608; }
      .num5 { font-family: "Arial", "Microsoft YaHei", sans-serif; font-weight: 900; fill: #050608; }
      .h15 { font-size: 68px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .h25 { font-size: 58px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .sub5 { font-size: 31px; font-weight: 560; fill: #5F6670; }
      .body5 { font-size: 30px; font-weight: 700; fill: #050608; }
      .muted5 { font-size: 24px; font-weight: 560; fill: #5F6670; }
      .label5 { font-size: 29px; font-weight: 900; fill: #050608; }
      .small5 { font-size: 23px; font-weight: 760; fill: #5F6670; }
      .micro5 { font-size: 19px; font-weight: 760; fill: #5F6670; }
    </style>
    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">09 / 13</text>
  
  
    
    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">03 / 方法演进</text>
    <text x="96" y="188" class="h15" style="font-size:64px">让 DFX 与 TDD 变成 Agent 协议</text>
    <text x="100" y="282" class="sub5">未来的护栏不是文档清单，而是可执行、可追踪、可复用的工程契约。</text>
    <path d="M96 356 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="356" r="5.5" fill="#FF5A1F"/>
  
    
    <rect x="100" y="390" width="560" height="250" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="134" y="414" class="micro5" style="fill:#106BEF;font-size:19px;font-weight:900">工程约束</text>
    <g transform="translate(134 440) scale(0.90625)"><path d="M32 6 L52 14 V30 q0 18 -20 28 Q12 48 12 30 V14 Z M22 32 l7 7 l15 -18" stroke="#106BEF" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="212" y="448" class="label5" style="font-size:30px">DFX：从清单到控制面</text>
    <text x="212" y="496" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">性能、安全、可观测、可维护</text><text x="212" y="528" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">进入检查项、基准、trace、发布预算。</text>
  
    
    <rect x="680" y="390" width="560" height="250" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="714" y="414" class="micro5" style="fill:#FF5A1F;font-size:19px;font-weight:900">验证范式</text>
    <g transform="translate(714 440) scale(0.90625)"><rect x="12" y="10" width="40" height="44" rx="4" stroke="#FF5A1F" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M22 32 l8 8 l14 -18" stroke="#FF5A1F" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="792" y="448" class="label5" style="font-size:30px">TDD：从用例到证据接口</text>
    <text x="792" y="496" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">先定义失败证据和验收边界，</text><text x="792" y="528" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">再让 Agent 在边界内生成和修复。</text>
  
    
    <rect x="1260" y="390" width="560" height="250" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="1294" y="414" class="micro5" style="fill:#106BEF;font-size:19px;font-weight:900">规则治理</text>
    <g transform="translate(1294 440) scale(0.90625)"><path d="M18 8 h22 l10 10 v38 H18 Z M40 8 v12 h12 M26 32 h20 M26 42 h18" stroke="#106BEF" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="1372" y="448" class="label5" style="font-size:30px">Code Rules：工具化</text>
    <text x="1372" y="496" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">规则仍会被幻觉绕过，</text><text x="1372" y="528" class="small5" style="font-size:23px;fill:#5F6670;font-weight:640">要拆成更细的可检查约束。</text>
  
    <path d="M330 696 C540 770 762 750 960 694 S1356 624 1590 706" stroke="#106BEF" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="402" y="770" width="1116" height="76" rx="16" fill="#FBFAF7" stroke="#C4C6C1" stroke-width="2"/>
    <text x="960" y="792" class="small5" text-anchor="middle" style="font-size:26px;font-weight:900">DFX、TDD、Review 将从人的流程习惯，变成 Agent 可执行的工程协议。</text>
    
    <rect x="260" y="936" width="1400" height="78" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M336 956 v38" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="992" y="958" class="body5" text-anchor="middle" style="font-size:30px">下一代工程方法会把“质量要求”变成 Agent 可以读取、执行、产证据的契约。</text>
  
  
</svg>