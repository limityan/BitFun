    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", "Segoe UI", Arial, sans-serif; dominant-baseline: hanging; }
      .brand5 { font-size: 42px; font-weight: 900; fill: #050608; }
      .num5 { font-family: "Arial", "Microsoft YaHei", sans-serif; font-weight: 900; fill: #050608; }
      .h15 { font-size: 68px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .h25 { font-size: 58px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .sub5 { font-size: 31px; font-weight: 560; fill: #5F6670; }
      .body5 { font-size: 30px; font-weight: 700; fill: #050608; }
      .muted5 { font-size: 24px; font-weight: 560; fill: #5F6670; }
      .label5 { font-size: 29px; font-weight: 900; fill: #050608; }
      .small5 { font-size: 23px; font-weight: 760; fill: #5F6670; }
      .micro5 { font-size: 19px; font-weight: 760; fill: #5F6670; }
    </style>
    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">11 / 14</text>



    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">03 / BitFun 缩影</text>
    <text x="96" y="188" class="h15" style="font-size:62px">把开发过程组织成团队工作流</text>
    <text x="100" y="282" class="sub5">从 Issue 到 PR，不是聊天产物堆叠，而是交付对象、证据包和阶段门禁。</text>
    <path d="M96 356 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="356" r="5.5" fill="#FF5A1F"/>

    <path d="M316 575 H424 M642 575 H750 M968 575 H1076 M1294 575 H1402" stroke="#106BEF" stroke-width="5" fill="none" marker-end="url(#arrowBlue)" opacity="0.88"/>

    <rect x="98" y="438" width="300" height="276" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="126" y="474" class="num5" style="font-size:39px;fill:#106BEF">01</text>
    <text x="126" y="524" class="label5" style="font-size:28px">Issue / Spec</text>
    <text x="126" y="566" class="small5" style="font-size:21px;fill:#106BEF;font-weight:900">目标与边界</text>
    <g transform="translate(304 472) scale(0.96875)"><path d="M18 8 h22 l10 10 v38 H18 Z M40 8 v12 h12 M26 32 h20 M26 42 h18" stroke="#106BEF" stroke-width="3.096774193548387" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="126" y="612" class="small5" style="font-size:22px;fill:#5F6670;font-weight:420">目标、非目标、风险</text><text x="126" y="643" class="small5" style="font-size:22px;fill:#5F6670;font-weight:420">验收标准先写清</text>


    <rect x="424" y="438" width="300" height="276" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="452" y="474" class="num5" style="font-size:39px;fill:#FF5A1F">02</text>
    <text x="452" y="524" class="label5" style="font-size:28px">Agent Worktree</text>
    <text x="452" y="566" class="small5" style="font-size:21px;fill:#FF5A1F;font-weight:900">隔离执行</text>
    <g transform="translate(630 472) scale(0.96875)"><path d="M18 18 L34 32 L18 46" stroke="#FF5A1F" stroke-width="3.096774193548387" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M38 48 h16" stroke="#FF5A1F" stroke-width="3.096774193548387" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="452" y="612" class="small5" style="font-size:22px;fill:#5F6670;font-weight:420">独立环境探索</text><text x="452" y="643" class="small5" style="font-size:22px;fill:#5F6670;font-weight:420">避免污染主分支</text>


    <rect x="750" y="438" width="300" height="276" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="778" y="474" class="num5" style="font-size:39px;fill:#106BEF">03</text>
    <text x="778" y="524" class="label5" style="font-size:28px">Evidence Packet</text>
    <text x="778" y="566" class="small5" style="font-size:21px;fill:#106BEF;font-weight:900">证据包</text>
    <g transform="translate(956 472) scale(0.96875)"><rect x="12" y="10" width="40" height="44" rx="4" stroke="#106BEF" stroke-width="3.096774193548387" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M22 32 l8 8 l14 -18" stroke="#106BEF" stroke-width="3.096774193548387" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="778" y="612" class="small5" style="font-size:22px;fill:#5F6670;font-weight:420">diff 摘要、测试、日志</text><text x="778" y="643" class="small5" style="font-size:22px;fill:#5F6670;font-weight:420">trace、风险、回滚路径</text>


    <rect x="1076" y="438" width="300" height="276" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="1104" y="474" class="num5" style="font-size:39px;fill:#FF5A1F">04</text>
    <text x="1104" y="524" class="label5" style="font-size:28px">Independent Review</text>
    <text x="1104" y="566" class="small5" style="font-size:21px;fill:#FF5A1F;font-weight:900">独立评审</text>
    <g transform="translate(1282 472) scale(0.96875)"><circle cx="32" cy="22" r="8" stroke="#FF5A1F" stroke-width="3.096774193548387" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="18" cy="30" r="6" stroke="#FF5A1F" stroke-width="3.096774193548387" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="46" cy="30" r="6" stroke="#FF5A1F" stroke-width="3.096774193548387" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M14 50 q18 -16 36 0 M4 54 q14 -12 28 -5 M32 49 q14 -7 28 5" stroke="#FF5A1F" stroke-width="3.096774193548387" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="1104" y="612" class="small5" style="font-size:22px;fill:#5F6670;font-weight:420">发现 / 仲裁分离</text><text x="1104" y="643" class="small5" style="font-size:22px;fill:#5F6670;font-weight:420">修复后重新验证</text>


    <rect x="1402" y="438" width="300" height="276" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="1430" y="474" class="num5" style="font-size:39px;fill:#106BEF">05</text>
    <text x="1430" y="524" class="label5" style="font-size:28px">Gate / Merge</text>
    <text x="1430" y="566" class="small5" style="font-size:21px;fill:#106BEF;font-weight:900">阶段放行</text>
    <g transform="translate(1608 472) scale(0.96875)"><path d="M32 6 L52 14 V30 q0 18 -20 28 Q12 48 12 30 V14 Z M22 32 l7 7 l15 -18" stroke="#106BEF" stroke-width="3.096774193548387" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="1430" y="612" class="small5" style="font-size:22px;fill:#5F6670;font-weight:420">PR、合并、发布</text><text x="1430" y="643" class="small5" style="font-size:22px;fill:#5F6670;font-weight:420">责任归属可追踪</text>

    <rect x="240" y="760" width="1440" height="104" rx="16" fill="#FBFAF7" stroke="#C4C6C1" stroke-width="2"/>
    <text x="960" y="794" class="label5" text-anchor="middle" style="font-size:28px">方法不是“多加审批”，而是让每个小变更都带着证据前进</text>
    <text x="960" y="838" class="small5" text-anchor="middle" style="font-size:22px;fill:#5F6670;font-weight:780">人看稳定 Artifact 和风险摘要；后台 trace 只在高风险、冲突证据或复盘时下钻。</text>

    <rect x="230" y="936" width="1460" height="78" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M306 956 v38" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="992" y="958" class="body5" text-anchor="middle" style="font-size:30px">BitFun 的价值不是某个功能，而是把 AI 开发从聊天结果推进到团队可治理的交付流。</text>


</svg>