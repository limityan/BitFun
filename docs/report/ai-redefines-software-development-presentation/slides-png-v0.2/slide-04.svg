    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">04 / 14</text>



    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">01 / 协作拓扑</text>
    <text x="96" y="188" class="h15" style="font-size:64px">从人 + 人，到人 + 人 + Agent + Agent</text>
    <text x="100" y="282" class="sub5">协作从同步沟通扩展到异步任务、角色化 Agent、证据化放行。</text>
