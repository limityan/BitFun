    <text x="222" y="542" class="small5" style="font-size:22px;fill:#5F6670;font-weight:540">人负责问题判断</text><text x="222" y="574" class="small5" style="font-size:22px;fill:#5F6670;font-weight:540">AI 辅助补全与解释</text>


    <rect x="478" y="416" width="340" height="236" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
