    <text x="328" y="730" class="label5" style="font-size:29px">协作重心变化</text>
    <text x="328" y="774" class="small5" style="font-size:22px;fill:#5F6670;font-weight:760">从“谁写代码”转向三个可判断对象：</text>

    <rect x="680" y="736" width="210" height="78" rx="14" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
