    <text x="785" y="788" class="small5" text-anchor="middle" style="font-size:21px;fill:#050608;font-weight:830">谁定义边界</text>


    <rect x="952" y="736" width="210" height="78" rx="14" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <text x="1057" y="754" class="label5" text-anchor="middle" style="font-size:26px;fill:#106BEF">证据</text>
    <text x="1057" y="788" class="small5" text-anchor="middle" style="font-size:21px;fill:#050608;font-weight:830">谁产出证明</text>


    <rect x="1224" y="736" width="210" height="78" rx="14" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <text x="1329" y="754" class="label5" text-anchor="middle" style="font-size:26px;fill:#106BEF">责任</text>
    <text x="1329" y="788" class="small5" text-anchor="middle" style="font-size:21px;fill:#050608;font-weight:830">谁最终放行</text>


    <rect x="200" y="936" width="1520" height="78" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M276 956 v38" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="992" y="958" class="body5" text-anchor="middle" style="font-size:30px">AI 时代的团队协作，不是 Agent 直接替人合并代码，而是 Agent 产出可审查的交付对象和证据包。</text>


