    </g>



    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", "Segoe UI", Arial, sans-serif; dominant-baseline: hanging; }
      .brand5 { font-size: 42px; font-weight: 900; fill: #050608; }
      .num5 { font-family: "Arial", "Microsoft YaHei", sans-serif; font-weight: 900; fill: #050608; }
      .h15 { font-size: 68px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .h25 { font-size: 58px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .sub5 { font-size: 31px; font-weight: 560; fill: #5F6670; }
      .body5 { font-size: 30px; font-weight: 700; fill: #050608; }
      .muted5 { font-size: 24px; font-weight: 560; fill: #5F6670; }
      .label5 { font-size: 29px; font-weight: 900; fill: #050608; }
      .small5 { font-size: 23px; font-weight: 760; fill: #5F6670; }
      .micro5 { font-size: 19px; font-weight: 760; fill: #5F6670; }
    </style>
    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">13 / 14</text>



    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">04 / 前瞻判断</text>
    <text x="96" y="188" class="h15" style="font-size:66px">三个未来判断</text>
    <text x="100" y="282" class="sub5">最后只带走三件事：指标、角色、协议都会被重写。</text>
    <path d="M96 356 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="356" r="5.5" fill="#FF5A1F"/>

    <path d="M430 740 C620 820 820 790 960 730 S1290 662 1490 760" stroke="#106BEF" stroke-width="5" fill="none" marker-end="url(#arrowBlue)" opacity="0.88"/>

    <rect x="120" y="430" width="520" height="250" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="158" y="464" class="num5" style="font-size:44px;fill:#106BEF">01</text>
    <text x="158" y="530" class="label5" style="font-size:32px">指标重写</text>
    <text x="158" y="584" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">从代码量转向净收益：</text><text x="158" y="618" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">交付时间、返工率、评审负担、</text><text x="158" y="652" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">线上风险与知识沉淀。</text>


    <rect x="700" y="372" width="520" height="250" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="738" y="406" class="num5" style="font-size:44px;fill:#FF5A1F">02</text>
    <text x="738" y="472" class="label5" style="font-size:32px">角色分化</text>
    <text x="738" y="526" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">开发者会更像 owner：</text><text x="738" y="560" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">定义目标、组织上下文、</text><text x="738" y="594" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">审查证据与承担责任。</text>


    <rect x="1280" y="430" width="520" height="250" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="1318" y="464" class="num5" style="font-size:44px;fill:#106BEF">03</text>
    <text x="1318" y="530" class="label5" style="font-size:32px">工程协议</text>
    <text x="1318" y="584" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">TDD / DFX / Review</text><text x="1318" y="618" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">会变成 Agent 可读取、</text><text x="1318" y="652" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">可执行、可产证据的协议。</text>

    <rect x="402" y="812" width="1116" height="92" rx="16" fill="#FBFAF7" stroke="#C4C6C1" stroke-width="2"/>
    <text x="960" y="840" class="body5" text-anchor="middle" style="font-size:31px">未来的核心能力：把 AI 从 demo 推向可验证、可治理、可协作的交付系统。</text>

    <rect x="370" y="936" width="1180" height="78" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M446 956 v38" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="992" y="958" class="body5" text-anchor="middle" style="font-size:30px">谁能把工程协议做成系统能力，谁就更接近 AI 时代的可靠交付。</text>


</svg>