    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", "Segoe UI", Arial, sans-serif; dominant-baseline: hanging; }
      .brand5 { font-size: 42px; font-weight: 900; fill: #050608; }
      .num5 { font-family: "Arial", "Microsoft YaHei", sans-serif; font-weight: 900; fill: #050608; }
      .h15 { font-size: 68px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .h25 { font-size: 58px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .sub5 { font-size: 31px; font-weight: 560; fill: #5F6670; }
      .body5 { font-size: 30px; font-weight: 700; fill: #050608; }
      .muted5 { font-size: 24px; font-weight: 560; fill: #5F6670; }
      .label5 { font-size: 29px; font-weight: 900; fill: #050608; }
      .small5 { font-size: 23px; font-weight: 760; fill: #5F6670; }
      .micro5 { font-size: 19px; font-weight: 760; fill: #5F6670; }
    </style>
    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">06 / 14</text>



    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">02 / 阶段纠错</text>
    <text x="96" y="188" class="h15" style="font-size:62px">用可控系统收敛不可控过程</text>
    <text x="100" y="282" class="sub5">过程可以记录在后台；人类判断聚焦交付对象、证据包和风险。</text>
    <path d="M96 356 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="356" r="5.5" fill="#FF5A1F"/>

    <rect x="108" y="388" width="512" height="322" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="164" y="448" class="small5" style="fill:#106BEF;font-weight:900">过程可变层</text>
    <text x="164" y="510" class="num5" style="font-size:44px">过程不等于交付</text>
    <text x="164" y="584" class="small5" style="font-size:24px;fill:#5F6670;font-weight:680">模型 / 提示词 / 工具调用会变化</text><text x="164" y="618" class="small5" style="font-size:24px;fill:#5F6670;font-weight:680">后台记录用于复现与审计</text><text x="164" y="652" class="small5" style="font-size:24px;fill:#5F6670;font-weight:680">日常评审不逐步追操作</text>

    <rect x="704" y="388" width="512" height="322" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="960" y="448" class="small5" text-anchor="middle" style="fill:#FF5A1F;font-weight:900">长链路风险</text>
    <text x="960" y="506" class="num5" text-anchor="middle" style="font-size:54px;fill:#FF5A1F">0.99^10 ≈ 0.90</text>
    <text x="960" y="572" class="small5" text-anchor="middle" style="font-size:27px;fill:#050608;font-weight:850">每步可靠，不等于系统可靠</text>
    <text x="960" y="622" class="small5" text-anchor="middle" style="font-size:23px;fill:#5F6670;font-weight:720">未校验交接会让错误</text>
    <text x="960" y="656" class="small5" text-anchor="middle" style="font-size:23px;fill:#5F6670;font-weight:720">被继承、放大、合理化。</text>

    <rect x="1300" y="388" width="512" height="322" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="1356" y="448" class="small5" style="fill:#106BEF;font-weight:900">工程收敛层</text>
    <text x="1356" y="510" class="num5" style="font-size:44px">收敛到交付对象</text>
    <text x="1356" y="584" class="small5" style="font-size:24px;fill:#5F6670;font-weight:680">完整代码与清晰变更</text><text x="1356" y="618" class="small5" style="font-size:24px;fill:#5F6670;font-weight:680">测试、运行、评审证据</text><text x="1356" y="652" class="small5" style="font-size:24px;fill:#5F6670;font-weight:680">风险与回滚路径可判断</text>

    <path d="M632 532 H674" stroke="#106BEF" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
    <path d="M1242 532 H1286" stroke="#106BEF" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="218" y="756" width="1484" height="112" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>

    <circle cx="278" cy="810" r="19" fill="#106BEF" opacity="0.12"/>
    <text x="278" y="798" class="small5" text-anchor="middle" style="font-size:20px;fill:#106BEF;font-weight:900">01</text>
    <text x="314" y="790" class="label5" style="font-size:27px">交付对象基线</text>
    <text x="314" y="832" class="small5" style="font-size:22px;fill:#5F6670;font-weight:720">需求、接口、代码、测试</text>


    <circle cx="622" cy="810" r="19" fill="#106BEF" opacity="0.12"/>
    <text x="622" y="798" class="small5" text-anchor="middle" style="font-size:20px;fill:#106BEF;font-weight:900">02</text>
    <text x="658" y="790" class="label5" style="font-size:27px">阶段门禁</text>
    <text x="658" y="832" class="small5" style="font-size:22px;fill:#5F6670;font-weight:720">完整性、契约、测试、风险</text>


    <circle cx="966" cy="810" r="19" fill="#106BEF" opacity="0.12"/>
    <text x="966" y="798" class="small5" text-anchor="middle" style="font-size:20px;fill:#106BEF;font-weight:900">03</text>
    <text x="1002" y="790" class="label5" style="font-size:27px">判断辅助</text>
    <text x="1002" y="832" class="small5" style="font-size:22px;fill:#5F6670;font-weight:720">摘要、差异、来源、不一致</text>


    <circle cx="1310" cy="810" r="19" fill="#106BEF" opacity="0.12"/>
    <text x="1310" y="798" class="small5" text-anchor="middle" style="font-size:20px;fill:#106BEF;font-weight:900">04</text>
    <text x="1346" y="790" class="label5" style="font-size:27px">Artifact 边界</text>
    <text x="1346" y="832" class="small5" style="font-size:22px;fill:#5F6670;font-weight:720">只管关键产物，不盯每步操作</text>


    <rect x="270" y="936" width="1380" height="78" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M346 956 v38" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="992" y="958" class="body5" text-anchor="middle" style="font-size:30px">人不需要监督每一步操作；系统把过程压缩成可判断的交付对象和证据包。</text>


</svg>