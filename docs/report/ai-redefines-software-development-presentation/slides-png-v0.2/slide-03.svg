<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="lightDots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#C4C6C1" opacity="0.55"/>
    </pattern>
    <filter id="paperShadow" x="-18%" y="-18%" width="136%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4B5563" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#106BEF" stroke-width="2"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#A5A9AE" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#FBFAF7"/>

    <rect x="1560" y="76" width="168" height="134" rx="12" fill="none" stroke="#D7D7D2" stroke-width="2"/>
    <path d="M1578 118 h42 m-42 28 h112 m-112 28 h88" stroke="#D7D7D2" stroke-width="2" stroke-dasharray="5 8" fill="none"/>
    <path d="M1848 56 h-88 q-28 0 -28 28 v126" stroke="#D7D7D2" stroke-width="2" fill="none"/>
    <path d="M1782 890 v-190 q0 -32 32 -32 h50" stroke="#D7D7D2" stroke-width="2" fill="none"/>
    <path d="M1650 820 h112 q30 0 30 -30 v-80" stroke="#D7D7D2" stroke-width="2" fill="none"/>
    <circle cx="1800" cy="708" r="7" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <circle cx="1762" cy="820" r="7" fill="#106BEF"/>
    <circle cx="1848" cy="622" r="6" fill="#FF5A1F"/>
    <rect x="1378" y="720" width="180" height="120" fill="url(#lightDots)" opacity="0.48"/>
    <rect x="152" y="318" width="128" height="96" fill="url(#lightDots)" opacity="0.42"/>
    <path d="M70 740 h120 v118 h250" stroke="#D7D7D2" stroke-width="2" fill="none"/>
    <path d="M50 510 h116 q26 0 26 26 v52" stroke="#D7D7D2" stroke-width="2" fill="none"/>
    <circle cx="150" cy="857" r="5" fill="#FF5A1F"/>

    <g opacity="0.26" transform="translate(1350 820) scale(0.72)">
      <path d="M0 120 L110 60 L220 120 L110 180 Z" fill="none" stroke="#C4C6C1" stroke-width="2"/>
      <path d="M110 60 V180 M0 120 V220 M220 120 V220 M0 220 H320" stroke="#C4C6C1" stroke-width="2" fill="none"/>
      <path d="M260 50 h70 v170 h-70 Z M280 80 h30 M280 116 h30 M280 152 h30" stroke="#C4C6C1" stroke-width="2" fill="none"/>
      <path d="M360 96 h90 v124 h-90 Z M382 122 h46 M382 154 h46 M382 186 h46" stroke="#C4C6C1" stroke-width="2" fill="none"/>
      <path d="M88 144 h42 v76 h-42 Z M150 126 h48 v94 h-48 Z" stroke="#C4C6C1" stroke-width="2" fill="none"/>
    </g>



    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", "Segoe UI", Arial, sans-serif; dominant-baseline: hanging; }
      .brand5 { font-size: 42px; font-weight: 900; fill: #050608; }
      .num5 { font-family: "Arial", "Microsoft YaHei", sans-serif; font-weight: 900; fill: #050608; }
      .h15 { font-size: 68px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .h25 { font-size: 58px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .sub5 { font-size: 31px; font-weight: 560; fill: #5F6670; }
      .body5 { font-size: 30px; font-weight: 700; fill: #050608; }
      .muted5 { font-size: 24px; font-weight: 560; fill: #5F6670; }
      .label5 { font-size: 29px; font-weight: 900; fill: #050608; }
      .small5 { font-size: 23px; font-weight: 760; fill: #5F6670; }
      .micro5 { font-size: 19px; font-weight: 760; fill: #5F6670; }
    </style>
    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">03 / 14</text>



    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">01 / 案例入口</text>
    <text x="96" y="188" class="h15" style="font-size:62px">数十万行代码之后，问题真的变少了吗？</text>
    <text x="100" y="282" class="sub5">AI 放大的不是代码量本身，而是速度、风险和组织方式的重新分配。</text>
    <path d="M96 356 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="356" r="5.5" fill="#FF5A1F"/>

    <rect x="116" y="410" width="600" height="398" rx="20" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="166" y="478" class="small5" style="fill:#106BEF;font-weight:900">BitFun 开场观察</text>
    <text x="166" y="548" class="num5" style="font-size:70px;fill:#106BEF">数十万行代码</text>
    <path d="M172 654 H654" stroke="#C4C6C1" stroke-width="3"/>
    <text x="166" y="690" class="body5" style="font-size:31px">这不是炫耀数字，而是压力测试</text>
    <text x="166" y="732" class="small5" style="font-size:23px">代码生产被放大后，验证、评审、协作、维护</text>
    <text x="166" y="764" class="small5" style="font-size:23px">是否也同步扩容？</text>
    <path d="M742 610 H830" stroke="#106BEF" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>

    <rect x="860" y="386" width="390" height="142" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="894" y="410" class="num5" style="font-size:42px;fill:#106BEF">A</text>
    <text x="970" y="416" class="label5" style="font-size:29px">原型验证更快</text>
    <text x="970" y="462" class="small5" style="font-size:22px;fill:#5F6670;font-weight:640">从想法到可运行版本的距离缩短。</text>


    <rect x="1300" y="386" width="390" height="142" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="1334" y="410" class="num5" style="font-size:42px;fill:#106BEF">B</text>
    <text x="1410" y="416" class="label5" style="font-size:29px">需求变更更灵活</text>
    <text x="1410" y="462" class="small5" style="font-size:22px;fill:#5F6670;font-weight:640">低成本试错让需求更频繁摆动。</text>


    <rect x="860" y="606" width="390" height="142" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="894" y="630" class="num5" style="font-size:42px;fill:#FF5A1F">C</text>
    <text x="970" y="636" class="label5" style="font-size:29px">评审负担转移</text>
    <text x="970" y="682" class="small5" style="font-size:22px;fill:#5F6670;font-weight:640">维护者要理解更多 AI 产物。</text>


    <rect x="1300" y="606" width="390" height="142" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="1334" y="630" class="num5" style="font-size:42px;fill:#FF5A1F">D</text>
    <text x="1410" y="636" class="label5" style="font-size:29px">集成风险上升</text>
    <text x="1410" y="682" class="small5" style="font-size:22px;fill:#5F6670;font-weight:640">测试、性能、架构稳定性成为瓶颈。</text>

    <rect x="232" y="846" width="1456" height="82" rx="12" fill="#FBFAF7" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M274 868 v38" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="318" y="870" class="body5" style="font-size:30px">问题从“能不能写出来”，转移到“凭什么可以合并、发布、长期维护”。</text>

    <rect x="240" y="936" width="1440" height="78" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M316 956 v38" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="992" y="958" class="body5" text-anchor="middle" style="font-size:30px">真正要观察的不是 LOC 膨胀，而是交付节奏、验证成本和团队协作是否一起改善。</text>


</svg>