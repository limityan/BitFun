    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">05 / 13</text>
  
  
    
    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">02 / 速度的背后</text>
    <text x="96" y="188" class="h15" style="font-size:70px">概率执行，证据放行</text>
    <text x="100" y="282" class="sub5">关注需求结果的确定性，放宽执行过程的概率性。</text>
    <path d="M96 356 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="356" r="5.5" fill="#FF5A1F"/>
  
    <rect x="146" y="408" width="704" height="366" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <rect x="1070" y="408" width="704" height="366" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="202" y="466" class="small5" style="fill:#106BEF;font-weight:900">开发者信任</text>
    <text x="202" y="528" class="num5" style="font-size:48px">同样模型，不同 Harness</text>
    <text x="202" y="604" class="small5" style="font-size:27px;fill:#5F6670;font-weight:680">只读计划 / 沙箱执行 / 危险命令拦截</text><text x="202" y="644" class="small5" style="font-size:27px;fill:#5F6670;font-weight:680">失败回注上下文 / trace 可回放</text><text x="202" y="684" class="small5" style="font-size:27px;fill:#5F6670;font-weight:680">让概率输出变得可观察、可停下、可追责</text>
    <text x="1126" y="466" class="small5" style="fill:#FF5A1F;font-weight:900">产品可靠性</text>
    <text x="1126" y="528" class="num5" style="font-size:48px">不是相信结果，而是验证结果</text>
    <text x="1126" y="604" class="small5" style="font-size:27px;fill:#5F6670;font-weight:680">测试 / Eval / Canary / 监控 / 人工审批</text><text x="1126" y="644" class="small5" style="font-size:27px;fill:#5F6670;font-weight:680">把“看起来能跑”转成“可以放行”</text><text x="1126" y="684" class="small5" style="font-size:27px;fill:#5F6670;font-weight:680">让最终结果具备确定性证据</text>
    <path d="M878 590 H1038" stroke="#106BEF" stroke-width="6" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="604" y="824" width="712" height="72" rx="14" fill="#FBFAF7" stroke="#C4C6C1" stroke-width="2"/>
    <text x="960" y="842" class="num5" text-anchor="middle" style="font-size:34px;fill:#106BEF">概率执行 + 确定证据 = 高置信交付</text>
    
    <rect x="280" y="936" width="1360" height="78" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M356 956 v38" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="992" y="958" class="body5" text-anchor="middle" style="font-size:30px">新范式不是消灭概率性，而是把概率性产物纳入证据、权限和回滚边界。</text>
  
  
</svg>