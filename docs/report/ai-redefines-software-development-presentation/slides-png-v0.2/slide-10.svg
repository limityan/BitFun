    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">03 / BitFun 缩影</text>
    <text x="96" y="188" class="h15" style="font-size:64px">把开发过程组织成工件流</text>
    <text x="100" y="282" class="sub5">计划、证据、评审、自迭代不只是功能，而是 Agent 工作的规范工件。</text>
