    </pattern>
    <filter id="paperShadow" x="-18%" y="-18%" width="136%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4B5563" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#106BEF" stroke-width="2"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#A5A9AE" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#FBFAF7"/>

    <rect x="1560" y="76" width="168" height="134" rx="12" fill="none" stroke="#D7D7D2" stroke-width="2"/>
    <path d="M1578 118 h42 m-42 28 h112 m-112 28 h88" stroke="#D7D7D2" stroke-width="2" stroke-dasharray="5 8" fill="none"/>
    <path d="M1848 56 h-88 q-28 0 -28 28 v126" stroke="#D7D7D2" stroke-width="2" fill="none"/>
    <path d="M1782 890 v-190 q0 -32 32 -32 h50" stroke="#D7D7D2" stroke-width="2" fill="none"/>
    <path d="M1650 820 h112 q30 0 30 -30 v-80" stroke="#D7D7D2" stroke-width="2" fill="none"/>
    <circle cx="1800" cy="708" r="7" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <circle cx="1762" cy="820" r="7" fill="#106BEF"/>
    <circle cx="1848" cy="622" r="6" fill="#FF5A1F"/>
    <rect x="1378" y="720" width="180" height="120" fill="url(#lightDots)" opacity="0.48"/>
    <rect x="152" y="318" width="128" height="96" fill="url(#lightDots)" opacity="0.42"/>
    <path d="M70 740 h120 v118 h250" stroke="#D7D7D2" stroke-width="2" fill="none"/>
    <path d="M50 510 h116 q26 0 26 26 v52" stroke="#D7D7D2" stroke-width="2" fill="none"/>
    <circle cx="150" cy="857" r="5" fill="#FF5A1F"/>

    <g opacity="0.26" transform="translate(1350 820) scale(0.72)">
      <path d="M0 120 L110 60 L220 120 L110 180 Z" fill="none" stroke="#C4C6C1" stroke-width="2"/>
      <path d="M110 60 V180 M0 120 V220 M220 120 V220 M0 220 H320" stroke="#C4C6C1" stroke-width="2" fill="none"/>
      <path d="M260 50 h70 v170 h-70 Z M280 80 h30 M280 116 h30 M280 152 h30" stroke="#C4C6C1" stroke-width="2" fill="none"/>
      <path d="M360 96 h90 v124 h-90 Z M382 122 h46 M382 154 h46 M382 186 h46" stroke="#C4C6C1" stroke-width="2" fill="none"/>
      <path d="M88 144 h42 v76 h-42 Z M150 126 h48 v94 h-48 Z" stroke="#C4C6C1" stroke-width="2" fill="none"/>
    </g>



    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", "Segoe UI", Arial, sans-serif; dominant-baseline: hanging; }
      .brand5 { font-size: 42px; font-weight: 900; fill: #050608; }
      .num5 { font-family: "Arial", "Microsoft YaHei", sans-serif; font-weight: 900; fill: #050608; }
      .h15 { font-size: 68px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .h25 { font-size: 58px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .sub5 { font-size: 31px; font-weight: 560; fill: #5F6670; }
      .body5 { font-size: 30px; font-weight: 700; fill: #050608; }
      .muted5 { font-size: 24px; font-weight: 560; fill: #5F6670; }
      .label5 { font-size: 29px; font-weight: 900; fill: #050608; }
      .small5 { font-size: 23px; font-weight: 760; fill: #5F6670; }
      .micro5 { font-size: 19px; font-weight: 760; fill: #5F6670; }
    </style>
    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">04 / 13</text>



    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">01 / 主线展开</text>
    <text x="96" y="188" class="h15" style="font-size:64px">产出放大后，协作对象变了</text>
    <text x="100" y="282" class="sub5">从“谁写代码”走向“任务如何被委派、证据如何被放行、责任如何落地”。</text>
    <path d="M96 356 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="356" r="5.5" fill="#FF5A1F"/>

    <rect x="120" y="384" width="1680" height="438" rx="24" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="174" y="426" class="small5" style="font-size:24px;fill:#106BEF;font-weight:900">BitFun 经验不是终点：代码生产放大以后，团队要管理新的交付对象</text>
    <path d="M680 468 V776 M1240 468 V776" stroke="#C4C6C1" stroke-width="2" stroke-dasharray="9 12"/>

    <text x="206" y="506" class="num5" style="font-size:42px;fill:#106BEF">01</text>
    <text x="294" y="510" class="label5" style="font-size:31px">任务委派</text>
    <text x="294" y="556" class="small5" style="font-size:20px;fill:#106BEF;font-weight:900">目标 / 工作区</text>
    <g transform="translate(212 632) scale(1)"><path d="M18 18 L34 32 L18 46" stroke="#106BEF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M38 48 h16" stroke="#106BEF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="294" y="630" class="small5" style="font-size:24px;fill:#050608;font-weight:860">人定义目标和边界</text>
    <text x="294" y="670" class="small5" style="font-size:24px;fill:#5F6670;font-weight:720">Agent 独立探索与修改</text>


    <text x="766" y="506" class="num5" style="font-size:42px;fill:#FF5A1F">02</text>
    <text x="854" y="510" class="label5" style="font-size:31px">角色分工</text>
    <text x="854" y="556" class="small5" style="font-size:20px;fill:#FF5A1F;font-weight:900">实现 / 测试 / 评审</text>
    <g transform="translate(772 632) scale(1)"><circle cx="32" cy="22" r="8" stroke="#FF5A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="18" cy="30" r="6" stroke="#FF5A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="46" cy="30" r="6" stroke="#FF5A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M14 50 q18 -16 36 0 M4 54 q14 -12 28 -5 M32 49 q14 -7 28 5" stroke="#FF5A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="854" y="630" class="small5" style="font-size:24px;fill:#050608;font-weight:860">Agent 分工产出中间结果</text>
    <text x="854" y="670" class="small5" style="font-size:24px;fill:#5F6670;font-weight:720">工具权限和生命周期受控</text>


    <text x="1326" y="506" class="num5" style="font-size:42px;fill:#106BEF">03</text>
    <text x="1414" y="510" class="label5" style="font-size:31px">证据放行</text>
    <text x="1414" y="556" class="small5" style="font-size:20px;fill:#106BEF;font-weight:900">PR / CI / Gate</text>
    <g transform="translate(1332 632) scale(1)"><rect x="12" y="10" width="40" height="44" rx="4" stroke="#106BEF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M22 32 l8 8 l14 -18" stroke="#106BEF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="1414" y="630" class="small5" style="font-size:24px;fill:#050608;font-weight:860">人看证据包和风险</text>
    <text x="1414" y="670" class="small5" style="font-size:24px;fill:#5F6670;font-weight:720">承担合并或发布责任</text>

    <text x="960" y="754" class="small5" text-anchor="middle" style="font-size:25px;fill:#050608;font-weight:880">协作对象从“代码”扩展为任务、Agent、工具执行和证据包。</text>

    <rect x="200" y="936" width="1520" height="78" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M276 956 v38" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="992" y="958" class="body5" text-anchor="middle" style="font-size:30px">AI 时代的团队协作，不是 Agent 直接替人合并代码，而是让 Agent 产出可审查的交付对象。</text>


</svg>