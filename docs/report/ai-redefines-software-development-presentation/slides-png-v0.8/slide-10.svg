    <text x="156" y="638" class="small5" style="font-size:22px;fill:#5F6670;font-weight:820">DFX / 兼容性 / 验收边界</text><text x="156" y="674" class="small5" style="font-size:22px;fill:#5F6670;font-weight:820">让 Agent 带着约束开始生成</text>


