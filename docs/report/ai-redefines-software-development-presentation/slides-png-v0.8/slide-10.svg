    <text x="736" y="638" class="small5" style="font-size:22px;fill:#5F6670;font-weight:820">先定义失败证据</text><text x="736" y="674" class="small5" style="font-size:22px;fill:#5F6670;font-weight:820">生成、修复、重跑形成闭环</text>


