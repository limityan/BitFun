    <text x="960" y="910" class="small5" text-anchor="middle" style="font-size:25px;fill:#050608;font-weight:900">变化的不是“谁写代码”，而是每一步交付件都要变成 Agent 可执行、人类可判断、平台可验证的证据。</text>

