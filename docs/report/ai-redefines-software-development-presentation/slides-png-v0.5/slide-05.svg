    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">01 / 模式变化</text>
    <text x="96" y="188" class="h15" style="font-size:58px">从传统 SDLC 到人 + Agent SDLC</text>
    <text x="100" y="282" class="sub5">角色没有消失，交付件发生变化：从人交接文档，转向人、Agent、平台共同维护证据。</text>
