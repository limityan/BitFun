    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">08 / 14</text>



    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">02 / 速度代价</text>
    <text x="96" y="188" class="h15" style="font-size:58px">速度的代价：把返工变成可管理队列</text>
    <text x="100" y="282" class="sub5">处理办法不是再加审批，而是量化代价、分流风险、闭环修复。</text>
    <path d="M96 356 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
