    <g transform="translate(333 421) scale(0.90625)"><rect x="10" y="10" width="18" height="18" stroke="#106BEF" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="36" y="10" width="18" height="18" stroke="#106BEF" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="10" y="36" width="18" height="18" stroke="#106BEF" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M41 36 l14 9 l-14 9 l-14 -9 Z" stroke="#106BEF" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="362" y="510" class="small5" text-anchor="middle" style="font-size:22px;fill:#106BEF;font-weight:900">01 / 量化代价</text>
    <text x="362" y="570" class="num5" text-anchor="middle" style="font-size:36px">看净时间，不看代码量</text>
    <text x="362" y="628" class="small5" text-anchor="middle" style="font-size:24px;fill:#5F6670;font-weight:680">METR：熟悉项目也可能变慢</text><text x="362" y="662" class="small5" text-anchor="middle" style="font-size:24px;fill:#5F6670;font-weight:680">Harness：评审、修 bug、</text><text x="362" y="696" class="small5" text-anchor="middle" style="font-size:24px;fill:#5F6670;font-weight:680">工具切换成为隐形工作</text><text x="362" y="730" class="small5" text-anchor="middle" style="font-size:24px;fill:#5F6670;font-weight:680">看 PR 等待、返工率、MTTR</text>

    <circle cx="960" cy="450" r="36" fill="#FF5A1F" opacity="0.12"/>
    <g transform="translate(931 421) scale(0.90625)"><circle cx="32" cy="22" r="8" stroke="#FF5A1F" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="18" cy="30" r="6" stroke="#FF5A1F" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="46" cy="30" r="6" stroke="#FF5A1F" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M14 50 q18 -16 36 0 M4 54 q14 -12 28 -5 M32 49 q14 -7 28 5" stroke="#FF5A1F" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="960" y="510" class="small5" text-anchor="middle" style="font-size:22px;fill:#FF5A1F;font-weight:900">02 / 风险分流</text>
    <text x="960" y="570" class="num5" text-anchor="middle" style="font-size:36px">让变更先被正确排队</text>
    <text x="960" y="628" class="small5" text-anchor="middle" style="font-size:24px;fill:#5F6670;font-weight:680">按 owner / diff / 模块热度</text><text x="960" y="662" class="small5" text-anchor="middle" style="font-size:24px;fill:#5F6670;font-weight:680">SLO 影响做风险打标</text><text x="960" y="696" class="small5" text-anchor="middle" style="font-size:24px;fill:#5F6670;font-weight:680">低风险自动验证</text><text x="960" y="730" class="small5" text-anchor="middle" style="font-size:24px;fill:#5F6670;font-weight:680">高风险进入设计与人工评审</text>

    <circle cx="1558" cy="450" r="36" fill="#106BEF" opacity="0.12"/>
    <g transform="translate(1529 421) scale(0.90625)"><path d="M48 18 A22 22 0 0 0 14 24 M14 24 h12 M14 24 v-12 M16 46 A22 22 0 0 0 50 40 M50 40 H38 M50 40 v12" stroke="#106BEF" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M24 34 l7 7 l13 -17" stroke="#106BEF" stroke-width="3.310344827586207" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="1558" y="510" class="small5" text-anchor="middle" style="font-size:22px;fill:#106BEF;font-weight:900">03 / 闭环修复</text>
    <text x="1558" y="570" class="num5" text-anchor="middle" style="font-size:36px">让失败回到 Agent</text>
    <text x="1558" y="628" class="small5" text-anchor="middle" style="font-size:24px;fill:#5F6670;font-weight:680">SWE-CI：CI 循环看可维护性</text><text x="1558" y="662" class="small5" text-anchor="middle" style="font-size:24px;fill:#5F6670;font-weight:680">SWE-PRBench：AI 评审非裁决</text><text x="1558" y="696" class="small5" text-anchor="middle" style="font-size:24px;fill:#5F6670;font-weight:680">AgentTrace / AgentRx：</text><text x="1558" y="730" class="small5" text-anchor="middle" style="font-size:24px;fill:#5F6670;font-weight:680">定位失败步骤与根因</text>

    <rect x="300" y="804" width="1320" height="80" rx="14" fill="#FBFAF7" stroke="#C4C6C1" stroke-width="2"/>
    <text x="960" y="826" class="body5" text-anchor="middle" style="font-size:27px"><tspan style="fill:#106BEF;font-weight:900">可执行方向：</tspan><tspan>PR 风险评分 + 证据包 + CI 失败回注 + Trace 归因</tspan></text>

    <rect x="360" y="936" width="1200" height="78" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M436 956 v38" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="992" y="958" class="body5" text-anchor="middle" style="font-size:30px">把速度收益从“写得快”，重新收敛到“交付快、返工少、风险可解释”。</text>


