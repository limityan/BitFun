    <g transform="rotate(-2 1508 104)">
      <text x="1268" y="58"
        style="font-family:'Arial Black','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:88px;font-weight:900;letter-spacing:1.4px;fill:#FF5A1F;fill-opacity:0.15;stroke:#FF5A1F;stroke-width:1.4;stroke-opacity:0.2;paint-order:stroke">04</text>
      <text x="1370" y="92"
        style="font-family:'Microsoft YaHei','Noto Sans SC','Segoe UI',sans-serif;font-size:38px;font-weight:900;letter-spacing:1.6px;fill:#FF5A1F;stroke:#FFFFFF;stroke-width:2.4;paint-order:stroke;fill-opacity:0.48">开发者角色</text>
      <path d="M1368 150 C1488 118 1628 174 1768 134" stroke="#FF5A1F" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.24"/>
    </g>


    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", "Segoe UI", Arial, sans-serif; dominant-baseline: hanging; }
      .brand5 { font-size: 42px; font-weight: 900; fill: #050608; }
      .num5 { font-family: "Arial", "Microsoft YaHei", sans-serif; font-weight: 900; fill: #050608; }
      .h15 { font-size: 68px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .h25 { font-size: 58px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .sub5 { font-size: 31px; font-weight: 560; fill: #5F6670; }
      .body5 { font-size: 30px; font-weight: 700; fill: #050608; }
      .muted5 { font-size: 24px; font-weight: 560; fill: #5F6670; }
      .label5 { font-size: 29px; font-weight: 900; fill: #050608; }
      .small5 { font-size: 23px; font-weight: 760; fill: #5F6670; }
      .micro5 { font-size: 19px; font-weight: 760; fill: #5F6670; }
    </style>
    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">12 / 13</text>



    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">04 / 能力转向</text>
    <text x="96" y="188" class="h15" style="font-size:62px">刚入职场：四个能力方向</text>
    <text x="100" y="282" class="sub5">AI 会降低写代码门槛，但不会自动补齐判断、验证、理解和协作能力。</text>
    <path d="M96 356 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="356" r="5.5" fill="#FF5A1F"/>

    <path d="M260 570 C560 480 760 520 960 590 S1360 702 1620 552" stroke="#106BEF" stroke-width="5" fill="none" marker-end="url(#arrowBlue)" opacity="0.42"/>
    <path d="M320 472 C650 398 1240 408 1580 494" stroke="#FF5A1F" stroke-width="4" fill="none" stroke-dasharray="10 14" opacity="0.32"/>

    <rect x="120" y="420" width="730" height="172" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <circle cx="200" cy="506" r="50" fill="#106BEF" opacity="0.10"/>
    <g transform="translate(170 476) scale(0.9375)"><path d="M24 20 L10 32 L24 44" stroke="#106BEF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M40 20 L54 32 L40 44" stroke="#106BEF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M36 14 L28 50" stroke="#106BEF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="272" y="454" class="num5" style="font-size:34px;fill:#106BEF">01</text>
    <text x="342" y="454" class="label5" style="font-size:31px">读懂与解释代码</text>
    <text x="342" y="506" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">能复现错误、读懂 diff、</text><text x="342" y="538" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">解释关键实现与边界条件。</text>


    <rect x="1070" y="420" width="730" height="172" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <circle cx="1150" cy="506" r="50" fill="#FF5A1F" opacity="0.10"/>
    <g transform="translate(1120 476) scale(0.9375)"><rect x="12" y="10" width="40" height="44" rx="4" stroke="#FF5A1F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M22 32 l8 8 l14 -18" stroke="#FF5A1F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="1222" y="454" class="num5" style="font-size:34px;fill:#FF5A1F">02</text>
    <text x="1292" y="454" class="label5" style="font-size:31px">证据驱动交付</text>
    <text x="1292" y="506" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">把测试、CI、trace、review</text><text x="1292" y="538" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">当成提交的一部分。</text>


    <rect x="120" y="650" width="730" height="172" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <circle cx="200" cy="736" r="50" fill="#FF5A1F" opacity="0.10"/>
    <g transform="translate(170 706) scale(0.9375)"><path d="M18 8 h22 l10 10 v38 H18 Z M40 8 v12 h12 M26 32 h20 M26 42 h18" stroke="#FF5A1F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="272" y="684" class="num5" style="font-size:34px;fill:#FF5A1F">03</text>
    <text x="342" y="684" class="label5" style="font-size:31px">理解需求与场景</text>
    <text x="342" y="736" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">产品定位、用户路径、体验约束、</text><text x="342" y="768" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">验收标准要能讲清楚。</text>


    <rect x="1070" y="650" width="730" height="172" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <circle cx="1150" cy="736" r="50" fill="#106BEF" opacity="0.10"/>
    <g transform="translate(1120 706) scale(0.9375)"><path d="M32 6 L52 14 V30 q0 18 -20 28 Q12 48 12 30 V14 Z M22 32 l7 7 l15 -18" stroke="#106BEF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="1222" y="684" class="num5" style="font-size:34px;fill:#106BEF">04</text>
    <text x="1292" y="684" class="label5" style="font-size:31px">承担责任边界</text>
    <text x="1292" y="736" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">判断该不该做、能不能合、</text><text x="1292" y="768" class="small5" style="font-size:24px;fill:#5F6670;font-weight:650">出了问题如何解释。</text>

    <rect x="356" y="846" width="1208" height="70" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="960" y="862" class="body5" text-anchor="middle" style="font-size:28px">给新人最实际的判断：把“能写代码”升级为“能理解问题并可靠交付”。</text>

    <rect x="370" y="954" width="1180" height="64" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M440 971 v30" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="986" y="970" class="body5" text-anchor="middle" style="font-size:27px">讨论题：哪些任务可以交给 AI，哪些能力必须自己亲手练出来？</text>


</svg>