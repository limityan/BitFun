    <text x="974" y="648" class="small5" style="font-size:19px;fill:#E5E7EB;font-weight:820">cargo test -p bitfun-core deep_review</text>
    <rect x="974" y="676" width="316" height="30" rx="15" fill="#064E3B"/>
    <text x="994" y="680" class="micro5" style="font-size:17px;fill:#BBF7D0;font-weight:900">证据不是口头说明，而是可复核产物</text>

    <rect x="352" y="852" width="1216" height="66" rx="16" fill="#FBFAF7" stroke="#C4C6C1" stroke-width="2"/>
    <text x="960" y="868" class="small5" text-anchor="middle" style="font-size:25px;fill:#050608;font-weight:900">协作对象从“代码”扩展为任务、Agent、工具执行和证据包。</text>

