    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">04 / 13</text>



    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">01 / 主线展开</text>
    <text x="96" y="188" class="h15" style="font-size:64px">产出放大后，协作对象变了</text>
    <text x="100" y="282" class="sub5">从“谁写代码”走向“任务如何被委派、证据如何被放行、责任如何落地”。</text>
    <path d="M96 356 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="356" r="5.5" fill="#FF5A1F"/>

    <text x="142" y="400" class="small5" style="font-size:24px;fill:#106BEF;font-weight:900">BitFun 经验不是终点：代码生产放大以后，团队要管理新的交付对象和证据对象</text>

    <rect x="130" y="450" width="650" height="92" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <g transform="translate(162 470) scale(0.84375)"><path d="M18 18 L34 32 L18 46" stroke="#106BEF" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M38 48 h16" stroke="#106BEF" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="224" y="472" class="num5" style="font-size:30px;fill:#106BEF">01</text>
    <text x="278" y="470" class="label5" style="font-size:28px">任务委派</text>
    <text x="278" y="512" class="small5" style="font-size:21px;fill:#5F6670;font-weight:720">目标、边界和验收标准先写清楚，Agent 在隔离工作区探索。</text>


    <rect x="130" y="566" width="650" height="92" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <g transform="translate(162 586) scale(0.84375)"><circle cx="32" cy="22" r="8" stroke="#FF5A1F" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="18" cy="30" r="6" stroke="#FF5A1F" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="46" cy="30" r="6" stroke="#FF5A1F" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M14 50 q18 -16 36 0 M4 54 q14 -12 28 -5 M32 49 q14 -7 28 5" stroke="#FF5A1F" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="224" y="588" class="num5" style="font-size:30px;fill:#FF5A1F">02</text>
    <text x="278" y="586" class="label5" style="font-size:28px">角色分工</text>
    <text x="278" y="628" class="small5" style="font-size:21px;fill:#5F6670;font-weight:720">实现、测试、评审、文档可以分离，但权限和上下文要受控。</text>


    <rect x="130" y="682" width="650" height="92" rx="16" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <g transform="translate(162 702) scale(0.84375)"><rect x="12" y="10" width="40" height="44" rx="4" stroke="#106BEF" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M22 32 l8 8 l14 -18" stroke="#106BEF" stroke-width="3.5555555555555554" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
    <text x="224" y="704" class="num5" style="font-size:30px;fill:#106BEF">03</text>
    <text x="278" y="702" class="label5" style="font-size:28px">证据放行</text>
    <text x="278" y="744" class="small5" style="font-size:21px;fill:#5F6670;font-weight:720">人不审每步操作，而是审差异、测试、风险和责任。</text>

