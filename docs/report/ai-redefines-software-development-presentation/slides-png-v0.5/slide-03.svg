    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">03 / 14</text>



    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">01 / 案例入口</text>
    <text x="96" y="188" class="h15" style="font-size:60px">单月 10W+ 行代码之后，问题真的变少了吗？</text>
    <text x="100" y="282" class="sub5">AI 放大的不是代码量本身，而是速度、风险和组织方式的重新分配。</text>
    <path d="M96 356 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="356" r="5.5" fill="#FF5A1F"/>

    <rect x="116" y="380" width="590" height="454" rx="20" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="166" y="448" class="small5" style="fill:#106BEF;font-weight:900">BitFun 开发经验</text>
    <text x="166" y="526" class="num5" style="font-size:68px;fill:#106BEF">单月 10W+ 行代码</text>
    <path d="M172 626 H646" stroke="#C4C6C1" stroke-width="3"/>
    <text x="166" y="666" class="body5" style="font-size:31px">不是炫耀数字，而是压力测试</text>
    <text x="166" y="710" class="small5" style="font-size:23px">代码生产被放大后，验证、评审、协作、维护</text>
    <text x="166" y="744" class="small5" style="font-size:23px">是否也同步扩容？</text>
    <text x="166" y="798" class="small5" style="font-size:22px;fill:#5F6670;font-weight:720">统计口径：作者提交历史，非代码质量结论。</text>
