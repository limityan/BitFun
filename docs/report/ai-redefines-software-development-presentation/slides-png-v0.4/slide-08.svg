<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="lightDots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.7" fill="#C4C6C1" opacity="0.55"/>
    </pattern>
    <filter id="paperShadow" x="-18%" y="-18%" width="136%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4B5563" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#106BEF" stroke-width="2"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#A5A9AE" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#FBFAF7"/>

    <path d="M1816 92 h-70 q-28 0 -28 28 v78" stroke="#D7D7D2" stroke-width="2" fill="none" opacity="0.34"/>
    <path d="M1782 890 v-190 q0 -32 32 -32 h50" stroke="#D7D7D2" stroke-width="2" fill="none"/>
    <path d="M1650 820 h112 q30 0 30 -30 v-80" stroke="#D7D7D2" stroke-width="2" fill="none"/>
    <circle cx="1800" cy="708" r="7" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <circle cx="1762" cy="820" r="7" fill="#106BEF"/>
    <circle cx="1848" cy="622" r="6" fill="#FF5A1F"/>
    <rect x="1378" y="720" width="180" height="120" fill="url(#lightDots)" opacity="0.48"/>
    <rect x="152" y="318" width="128" height="96" fill="url(#lightDots)" opacity="0.42"/>
    <path d="M70 740 h120 v118 h250" stroke="#D7D7D2" stroke-width="2" fill="none"/>
    <path d="M50 510 h116 q26 0 26 26 v52" stroke="#D7D7D2" stroke-width="2" fill="none"/>
    <circle cx="150" cy="857" r="5" fill="#FF5A1F"/>

    <g opacity="0.26" transform="translate(1350 820) scale(0.72)">
      <path d="M0 120 L110 60 L220 120 L110 180 Z" fill="none" stroke="#C4C6C1" stroke-width="2"/>
      <path d="M110 60 V180 M0 120 V220 M220 120 V220 M0 220 H320" stroke="#C4C6C1" stroke-width="2" fill="none"/>
      <path d="M260 50 h70 v170 h-70 Z M280 80 h30 M280 116 h30 M280 152 h30" stroke="#C4C6C1" stroke-width="2" fill="none"/>
      <path d="M360 96 h90 v124 h-90 Z M382 122 h46 M382 154 h46 M382 186 h46" stroke="#C4C6C1" stroke-width="2" fill="none"/>
      <path d="M88 144 h42 v76 h-42 Z M150 126 h48 v94 h-48 Z" stroke="#C4C6C1" stroke-width="2" fill="none"/>
    </g>



    <g transform="rotate(-2 1508 104)">
      <text x="1268" y="58"
        style="font-family:'Arial Black','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:88px;font-weight:900;letter-spacing:1.4px;fill:#FF5A1F;fill-opacity:0.15;stroke:#FF5A1F;stroke-width:1.4;stroke-opacity:0.2;paint-order:stroke">03</text>
      <text x="1370" y="92"
        style="font-family:'Microsoft YaHei','Noto Sans SC','Segoe UI',sans-serif;font-size:38px;font-weight:900;letter-spacing:1.6px;fill:#FF5A1F;stroke:#FFFFFF;stroke-width:2.4;paint-order:stroke;fill-opacity:0.48">工程质量与治理</text>
      <path d="M1368 150 C1488 118 1628 174 1768 134" stroke="#FF5A1F" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.24"/>
    </g>


    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans SC", "PingFang SC", "Segoe UI", Arial, sans-serif; dominant-baseline: hanging; }
      .brand5 { font-size: 42px; font-weight: 900; fill: #050608; }
      .num5 { font-family: "Arial", "Microsoft YaHei", sans-serif; font-weight: 900; fill: #050608; }
      .h15 { font-size: 68px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .h25 { font-size: 58px; font-weight: 900; fill: #050608; letter-spacing: 0; }
      .sub5 { font-size: 31px; font-weight: 560; fill: #5F6670; }
      .body5 { font-size: 30px; font-weight: 700; fill: #050608; }
      .muted5 { font-size: 24px; font-weight: 560; fill: #5F6670; }
      .label5 { font-size: 29px; font-weight: 900; fill: #050608; }
      .small5 { font-size: 23px; font-weight: 760; fill: #5F6670; }
      .micro5 { font-size: 19px; font-weight: 760; fill: #5F6670; }
    </style>
    <text x="42" y="46" class="brand5">BitFun</text>
    <text x="1840" y="50" class="small5" text-anchor="end">08 / 13</text>



    <text x="96" y="132" class="small5" style="fill:#106BEF;font-weight:900">03 / 工程质量与治理</text>
    <text x="96" y="188" class="h15" style="font-size:66px">从门禁到智能护栏</text>
    <text x="100" y="282" class="sub5">开源重公共责任，大厂重复杂交付；共同核心是责任链和证据链。</text>
    <path d="M96 356 h112" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="230" cy="356" r="5.5" fill="#FF5A1F"/>

    <rect x="128" y="420" width="520" height="312" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="188" y="478" class="small5" style="fill:#106BEF;font-weight:900">开源高质量要求</text>
    <text x="188" y="536" class="num5" style="font-size:40px">维护者要验证海量变更</text>
    <text x="188" y="604" class="small5" style="font-size:23px;fill:#5F6670;font-weight:650">贡献者对提交负责</text><text x="188" y="635" class="small5" style="font-size:23px;fill:#5F6670;font-weight:650">维护者看方向、可读性、测试、长期演进</text><text x="188" y="666" class="small5" style="font-size:23px;fill:#5F6670;font-weight:650">核心问题：如何提升对提交代码质量</text><text x="188" y="697" class="small5" style="font-size:23px;fill:#5F6670;font-weight:650">的信任度</text>
    <rect x="1272" y="420" width="520" height="312" rx="18" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2" filter="url(#paperShadow)"/>
    <text x="1332" y="478" class="small5" style="fill:#FF5A1F;font-weight:900">大厂复杂交付</text>
    <text x="1332" y="536" class="num5" style="font-size:40px">跨团队看确定性工件</text>
    <text x="1332" y="604" class="small5" style="font-size:23px;fill:#5F6670;font-weight:650">需求 / 设计 / API / SLO / 证据</text><text x="1332" y="638" class="small5" style="font-size:23px;fill:#5F6670;font-weight:650">Artifact 贯穿计划、实现、发布与复盘</text><text x="1332" y="672" class="small5" style="font-size:23px;fill:#5F6670;font-weight:650">核心问题：哪些产物必须稳定可追踪</text>
    <circle cx="960" cy="590" r="166" fill="#FBFAF7" stroke="#C4C6C1" stroke-width="3"/>
    <text x="960" y="514" class="num5" text-anchor="middle" style="font-size:38px;fill:#106BEF">责任链</text>
    <text x="960" y="582" class="num5" text-anchor="middle" style="font-size:38px;fill:#050608">证据链</text>
    <text x="960" y="650" class="num5" text-anchor="middle" style="font-size:38px;fill:#FF5A1F">Artifact 链</text>
    <path d="M648 576 H782" stroke="#106BEF" stroke-width="5" fill="none" marker-end="url(#arrowBlue)"/>
    <path d="M1138 576 H1272" stroke="#FF5A1F" stroke-width="5" fill="none" marker-end="url(#arrowGray)"/>
    <rect x="300" y="805" width="1320" height="92" rx="14" fill="#FBFAF7" stroke="#C4C6C1" stroke-width="2"/>
    <text x="960" y="830" class="body5" text-anchor="middle" style="font-size:30px">小批量、强证据、可回滚，是抵消 AI 大规模变更不确定性的工程底座。</text>

    <rect x="210" y="936" width="1500" height="78" rx="10" fill="#FFFFFF" stroke="#C4C6C1" stroke-width="2"/>
    <path d="M286 956 v38" stroke="#106BEF" stroke-width="8" stroke-linecap="round"/>
    <text x="992" y="958" class="body5" text-anchor="middle" style="font-size:30px">质量治理的核心不是多一道审批，而是每个小变更都带着责任、证据和稳定工件前进。</text>


</svg>