    <path d="M174 592 H586" stroke="#C4C6C1" stroke-width="3"/>
    <text x="174" y="636" class="body5" style="font-size:27px">不是炫耀数字，而是压力测试</text>
    <text x="174" y="684" class="small5" style="font-size:21px">验证、评审、协作、维护是否同步扩容？</text>
    <text x="174" y="730" class="small5" style="font-size:19px;fill:#5F6670;font-weight:720">统计口径：作者提交历史，非代码质量结论。</text>
